[project]
name = "lmstelkom-mcp"
version = "0.1.0"
description = "MCP server untuk LMS Telkom University (Moodle)"
authors = [{ name = "Bagus Ardin Prayoga" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=50.0.2",
    "httpx>=0.27",
    "mcp>=2.3.0",
    "pypdf>=6.21.4",
    "python-docx>=1.2.0",
    "python-dotenv>=1.0",
    "python-pptx>=1.0.2",
]

[project.scripts]
lms-mcp = "lmstelkom_mcp.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lmstelkom_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
